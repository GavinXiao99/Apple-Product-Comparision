<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apple 产品和配件在主要国家与地区的官网价格、教育价格及汇率换算。" />
    <title>Apple 产品全球价格对比</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f5f7;
        --surface: #ffffff;
        --surface-soft: #fafafa;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --faint: #98989d;
        --rule: #dedee2;
        --blue: #0071e3;
        --green: #167744;
        --green-soft: #edf8f1;
        --amber: #965500;
        --amber-soft: #fff7e8;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.06);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--canvas);
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      button, select { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; }

      .shell {
        width: min(1500px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .hero {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 22px;
        align-items: center;
        padding: 26px 30px;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .apple-mark {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 8px;
        color: white;
        background: var(--ink);
        font-size: 42px;
        line-height: 1;
      }

      h1, h2, h3, p { margin: 0; }
      h1 { font-size: clamp(30px, 3vw, 44px); line-height: 1.08; letter-spacing: 0; }
      .hero-copy p { margin-top: 9px; color: var(--muted); line-height: 1.55; }
      .verified {
        display: grid;
        gap: 4px;
        justify-items: end;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums lining-nums;
      }
      .verified strong { color: var(--green); font-size: 14px; }

      .controls {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin: 24px 0 14px;
      }

      .product-tabs, .sku-tabs, .view-tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .product-tabs { flex: 1; padding: 3px 0 8px; }
      .sku-tabs { padding: 2px 0 14px; }
      .view-tabs { flex: none; padding: 4px; background: #e8e8ed; border-radius: 8px; }

      .tab, .sku {
        min-height: 40px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        font-weight: 650;
        white-space: nowrap;
        transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }
      .tab { padding: 0 14px; }
      .sku { padding: 9px 14px; border: 1px solid var(--rule); background: rgba(255,255,255,.72); }
      .tab:hover, .sku:hover { color: var(--ink); }
      .tab.on, .sku.on {
        color: var(--ink);
        background: var(--surface);
        box-shadow: 0 2px 8px rgba(0,0,0,.07);
      }
      .product-tabs .tab.on { color: var(--blue); box-shadow: inset 0 -2px var(--blue); }
      .tab:focus-visible, .sku:focus-visible, .row:focus-visible { outline: 3px solid rgba(0,113,227,.3); outline-offset: 2px; }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 318px;
        gap: 18px;
        align-items: start;
      }
      .panel, .summary, .distribution, .notes {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .panel { overflow: hidden; }
      .panel-title {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        min-height: 72px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--rule);
      }
      .panel-title h2 { font-size: 20px; letter-spacing: 0; }
      .panel-title span { color: var(--muted); font-size: 13px; white-space: nowrap; }

      .table-scroll { overflow-x: auto; }
      .head, .row {
        display: grid;
        grid-template-columns:
          54px minmax(112px, 1fr) minmax(122px, 1fr) minmax(122px, 1fr)
          minmax(110px, .9fr) minmax(110px, .9fr) minmax(118px, .95fr) minmax(118px, .95fr) 76px;
        gap: 14px;
        align-items: center;
        min-width: 1010px;
        padding: 0 22px;
      }
      .head {
        min-height: 48px;
        color: var(--muted);
        background: var(--surface-soft);
        border-bottom: 1px solid var(--rule);
        font-size: 12px;
        font-weight: 700;
      }
      .row {
        position: relative;
        min-height: 61px;
        color: var(--ink);
        border-bottom: 1px solid #ececef;
        text-decoration: none;
        font-size: 14px;
      }
      .row:last-child { border-bottom: 0; }
      .row:nth-child(even) { background: #fcfcfd; }
      .row:first-child { background: var(--green-soft); }
      .row:hover { background: #f2f7fd; }

      .head > span:nth-child(n+3):not(:last-child),
      .row > span:nth-child(n+3):not(:last-child) { text-align: right; }
      .head > span:first-child, .row > span:first-child,
      .head > span:last-child, .row > span:last-child { text-align: center; }
      .money {
        white-space: nowrap;
        font-variant-numeric: tabular-nums lining-nums;
        font-feature-settings: "tnum" 1, "lnum" 1;
      }
      .empty { color: var(--faint); font-size: 12px; }
      .rank { color: var(--faint); font-variant-numeric: tabular-nums; }
      .region { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
      .region b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mobile-rank { display: none; }
      .state {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-width: 60px;
        min-height: 28px;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--green);
        background: #e4f5ea;
        font-size: 12px;
        font-weight: 750;
      }
      .state.none { color: var(--muted); background: #eeeeF0; }

      .side { display: grid; gap: 16px; }
      .summary, .distribution, .notes { padding: 22px; }
      .summary { border-top: 3px solid var(--green); }
      .eyebrow { color: var(--green); font-size: 12px; font-weight: 750; }
      .summary strong {
        display: block;
        margin: 8px 0 5px;
        font-size: 36px;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums lining-nums;
      }
      .winner { color: var(--muted); font-size: 14px; }
      .saving { margin-top: 13px; color: var(--green); font-size: 13px; }
      .distribution h3, .notes h3 { margin-bottom: 16px; font-size: 16px; }
      .bars { display: grid; gap: 11px; }
      .bar-row { display: grid; grid-template-columns: 40px 1fr 82px; gap: 8px; align-items: center; font-size: 12px; }
      .bar-row b { color: var(--muted); }
      .bar-track { height: 7px; overflow: hidden; border-radius: 99px; background: #e4e4e8; }
      .bar-fill { height: 100%; border-radius: inherit; background: var(--blue); }
      .bar-row strong { text-align: right; font-variant-numeric: tabular-nums; }
      .notes p { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .notes .context { padding: 10px 11px; color: var(--amber); background: var(--amber-soft); border-left: 3px solid #e7a93e; }
      .audit { display: inline-block; margin-top: 14px; color: var(--blue); font-size: 13px; font-weight: 700; text-underline-offset: 3px; }

      @media (max-width: 1280px) {
        .layout { grid-template-columns: 1fr; }
        .side { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 780px) {
        .shell { width: min(100% - 24px, 720px); padding-top: 12px; }
        .hero { grid-template-columns: 54px 1fr; padding: 20px; }
        .apple-mark { width: 54px; height: 54px; font-size: 30px; }
        h1 { font-size: 27px; }
        .verified { grid-column: 1 / -1; justify-items: start; padding-top: 4px; }
        .controls { display: grid; gap: 12px; margin-top: 18px; }
        .view-tabs { width: fit-content; }
        .side { grid-template-columns: 1fr; }
        .panel-title { align-items: flex-start; flex-direction: column; padding: 17px; }
        .table-scroll { overflow: visible; padding: 10px; }
        .head { display: none; }
        .tbody { display: grid; gap: 10px; }
        .row {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px 12px;
          min-width: 0;
          min-height: 0;
          padding: 16px;
          border: 1px solid var(--rule);
          border-radius: 8px;
          background: var(--surface);
        }
        .row:first-child { background: var(--green-soft); }
        .row > span { min-width: 0; text-align: right; }
        .row > span::before {
          content: attr(data-label);
          display: block;
          margin-bottom: 4px;
          color: var(--faint);
          font-size: 10px;
          font-weight: 700;
        }
        .row > .rank { display: none; }
        .row > .region { grid-column: 1 / -1; text-align: left; }
        .row > .region::before { display: none; }
        .region b { font-size: 16px; }
        .mobile-rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: white; background: var(--ink); font-size: 11px; font-style: normal; }
        .row > .state { justify-self: end; }
        .row > .state::before { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .tab, .sku { transition: none; }
      }
    </style>
  </head>

      </section>

      let activeSku = D.skus.find((sku) => sku[1] === activeLine)[0];
      let activeView = "all";
      const $ = (selector) => document.querySelector(selector);

      function money(value, currency) {
        if (value == null) return "—";
        return new Intl.NumberFormat("zh-CN", {
          style: "currency",
          currency,
          currencyDisplay: "symbol",
          maximumFractionDigits: currency === "JPY" || currency === "KRW" ? 0 : 2,
        }).format(value);
      }

      function skuLabel(sku) {
        const parts = [sku[2]];
        if (sku[3] !== "N/A" && !sku[2].includes(sku[3])) parts.push(sku[3]);
        if (sku[4] !== "N/A" && sku[4] !== "配件") parts.push(sku[4]);
        return parts.join(" · ");
      }

      function priceRows() {
        const byRegion = new Map(
          D.rows.filter((row) => D.skus[row[0]][0] === activeSku).map((row) => [row[1], row]),
        );
        return D.regions.map((region, index) => {
          const raw = byRegion.get(index);
          const rate = D.rates[region[3]];
          const local = raw?.[2] ?? null;
          const education = raw?.[3] ?? null;
          return {
            region, raw, local, education,
            cny: local == null ? null : Math.round(local * rate[0] * 100) / 100,
            usd: local == null ? null : Math.round(local * rate[1] * 100) / 100,
            educationCny: education == null ? null : Math.round(education * rate[0] * 100) / 100,
            educationUsd: education == null ? null : Math.round(education * rate[1] * 100) / 100,
          };
        }).sort((a, b) => (a.cny ?? Number.MAX_VALUE) - (b.cny ?? Number.MAX_VALUE));
      }

      function draw() {
        const lineSkus = D.skus.filter((sku) => sku[1] === activeLine);
        if (!lineSkus.some((sku) => sku[0] === activeSku)) activeSku = lineSkus[0][0];

        $(".product-tabs").innerHTML = D.lines.map((line) =>
          `<button class="tab ${line[0] === activeLine ? "on" : ""}" data-line="${line[0]}" type="button">${line[1]}</button>`,
        ).join("");
        $(".sku-tabs").innerHTML = lineSkus.map((sku) =>
          `<button class="sku ${sku[0] === activeSku ? "on" : ""}" data-sku="${sku[0]}" type="button">${skuLabel(sku)}</button>`,
        ).join("");

        const sku = D.skus.find((item) => item[0] === activeSku);
        const rows = priceRows();
        const visible = activeView === "education" ? rows.filter((row) => row.education != null) : rows;
        const priced = rows.filter((row) => row.cny != null);
        const lowest = priced[0];
        const highest = priced[priced.length - 1];

        $(".panel-title h2").textContent = skuLabel(sku);
        $(".row-count").textContent = `${visible.filter((row) => row.local != null).length} 个地区已核验`;
        $(".tbody").innerHTML = visible.map((row, index) => {
          const source = activeView === "education" && row.raw?.[5] ? row.raw[5] : row.raw?.[4] || "#";
          const rank = row.cny == null ? "—" : index + 1;
          return `<a class="row" href="${source}" target="_blank" rel="noreferrer">
            <span class="rank" data-label="排名">${rank}</span>
            <span class="region" data-label="地区"><i class="mobile-rank">${rank}</i><span>${row.region[2]}</span><b>${row.region[1]}</b></span>
            <span class="money" data-label="官网原价">${money(row.local, row.region[3])}</span>
            <span class="money ${row.education == null ? "empty" : ""}" data-label="教育原价">${row.education == null ? "无官方教育价" : money(row.education, row.region[3])}</span>
            <span class="money" data-label="CNY">${money(row.cny, "CNY")}</span>
            <span class="money" data-label="USD">${money(row.usd, "USD")}</span>
            <span class="money" data-label="教育 CNY">${money(row.educationCny, "CNY")}</span>
            <span class="money" data-label="教育 USD">${money(row.educationUsd, "USD")}</span>
            <span class="state ${row.cny == null ? "none" : ""}" data-label="状态">${row.cny == null ? "未核到" : index === 0 ? "最低" : "官网"}</span>
          </a>`;
        }).join("");

        $(".summary strong").textContent = lowest ? money(lowest.cny, "CNY") : "—";
        $(".winner").textContent = lowest ? `${lowest.region[2]} ${lowest.region[1]}` : "当前配置暂无价格";
        $(".saving").textContent = lowest && highest ? `比最高价节省 ${Math.round((highest.cny - lowest.cny) / highest.cny * 1000) / 10}%` : "—";
        $(".bars").innerHTML = priced.slice(0, 8).map((row) =>
          `<div class="bar-row"><b>${row.region[0].toUpperCase()}</b><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8, row.cny / highest.cny * 100)}%"></div></div><strong>${money(row.cny, "CNY")}</strong></div>`,
        ).join("");

        const context = $(".notes .context");
        context.hidden = false;
        if (activeSku === "ipad-pro-11-magic-keyboard") {
          context.textContent = "妙控键盘比较 11 英寸 M5 / M4 共用款；颜色为黑色，键盘语言采用各地区默认版本。";
        } else if (activeLine === "macbook-pro") {
          context.textContent = "仅比较当前各尺寸起步配置：14 英寸为 M5、16GB 内存、1TB SSD；16 英寸为 M5 Pro、24GB 内存、1TB SSD，均采用标准显示屏。";
        } else if (activeLine === "vision-pro") {
          context.textContent = "韩国 256GB 的 2025 年发布价为 ₩4,990,000；当前购买页为 ₩5,790,000。跨地区购买前请确认账户地区、光学插片处方和售后条件。";
        } else {
          context.hidden = true;
        }
      }

      document.addEventListener("click", (event) => {
        const lineButton = event.target.closest("[data-line]");
        const skuButton = event.target.closest("[data-sku]");
        const viewButton = event.target.closest("[data-view]");
        if (lineButton) { activeLine = lineButton.dataset.line; draw(); }
        if (skuButton) { activeSku = skuButton.dataset.sku; draw(); }
        if (viewButton) {
          activeView = viewButton.dataset.view;
          document.querySelectorAll("[data-view]").forEach((button) => button.classList.toggle("on", button.dataset.view === activeView));
          draw();
        }
      });

      draw();
    </script>
  </body>
</html>
